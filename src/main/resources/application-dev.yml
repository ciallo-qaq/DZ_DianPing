spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3308/dingping?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  redis:
    host: 127.0.0.1
    port: 6380
    password: 123456
    database: 0

    lettuce:
      pool:
        max-active: 30
        max-idle: 15
        min-idle: 5
        time-between-eviction-runs: 10s

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# 仅开发环境打开接口性能采集，日志直接输出到控制台
dev-trace:
  enabled: true
